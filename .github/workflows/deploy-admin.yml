name: Deploy existing Artemis admin
on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artemis-existing-admin-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'artemissignals/artemissignals-platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          persist-credentials: false
                - name: Check GitHub identity
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request

          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          url += ('&' if '?' in url else '?') + 'audience=sts.amazonaws.com'
          request = urllib.request.Request(
              url,
              headers={
                  'Authorization': 'Bearer ' +
                  os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
              }
          )
          with urllib.request.urlopen(request) as response:
              token = json.load(response)['value']

          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(
              payload + '=' * (-len(payload) % 4)
          ))
          print(json.dumps({
              key: claims.get(key)
              for key in ('sub', 'aud', 'repository', 'ref')
          }, indent=2))
          PY
      - name: Get temporary AWS deployment credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::078809709432:role/artemis-existing-admin-github-deploy
          aws-region: eu-west-2
          role-duration-seconds: 1800
          role-session-name: ArtemisAdmin-${{ github.run_id }}
          allowed-account-ids: '078809709432'
      - name: Validate, package and deploy admin folder
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,re,subprocess,sys,time,urllib.parse,urllib.request,zipfile
          from html.parser import HTMLParser
          from pathlib import Path
          APP='d1c39lv7sdpoz4';BRANCH='main';REGION='eu-west-2';REPOSITORY='artemissignals/artemissignals-platform'

          def require(ok,message):
              if not ok:raise RuntimeError(message)
          def aws(operation,**params):
              command=['aws','amplify',operation,'--region',REGION,'--output','json']
              for key,value in params.items():command+=['--'+key.replace('_','-'),str(value)]
              result=subprocess.run(command,capture_output=True,text=True)
              require(result.returncode==0,'AWS '+operation+' failed. Check the role permissions and target app; sensitive response details are withheld.')
              return json.loads(result.stdout)

          class Assets(HTMLParser):
              def __init__(self):super().__init__();self.refs=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag in ('script','img','source') and a.get('src'):self.refs.append(a['src'])
                  if tag=='link' and a.get('href') and any(x in a.get('rel','').split() for x in ('stylesheet','icon','preload')):self.refs.append(a['href'])

          def bundle(root,tracked,commit):
              require(root.is_dir() and not root.is_symlink(),'The repository must contain an admin/ directory.')
              allowed={'.html','.js','.css','.png','.jpg','.jpeg','.gif','.svg','.ico','.webp','.woff','.woff2','.ttf','.otf','.json','.txt','.map'}
              files={}
              for name in tracked:
                  p=Path(name)
                  require(p.parts and p.parts[0]=='admin' and '..' not in p.parts,'Unexpected tracked path.')
                  relative=Path(*p.parts[1:])
                  if not relative.parts or any(x.startswith('.') for x in relative.parts):continue
                  if relative.suffix.lower() not in allowed:continue
                  source=root/relative
                  require(not source.is_symlink() and source.resolve().is_relative_to(root.resolve()),'Symlinks or paths outside admin/ are not permitted.')
                  require(source.is_file(),'Tracked file is missing: '+str(relative))
                  files[relative.as_posix()]=source.read_bytes()
              for required in ('index.html','communications.js','communications-config.js'):require(required in files,'Missing admin/'+required+'. Copy the Communications admin files into the admin/ folder and commit them.')
              page=files['index.html'].decode('utf-8')
              require('id="communications"' in page and 'OFFLINE DESIGN PREVIEW' not in page,'admin/index.html is not the live Communications build. Commit the updated admin page first.')
              require(re.search(r'window\.ARTEMIS_COMMUNICATIONS_API\s*=\s*[\"\']https://[a-z0-9]+\.execute-api\.eu-west-2\.amazonaws\.com[\"\']',files['communications-config.js'].decode()),'communications-config.js is empty or invalid. Run setup_communications.py --deploy and commit the generated config.')
              assets=Assets();assets.feed(page)
              for value in assets.refs:
                  u=urllib.parse.urlsplit(value)
                  if u.scheme or u.netloc or not u.path:continue
                  rel=urllib.parse.unquote(u.path).lstrip('/')
                  require(rel in files,'Referenced admin asset is missing from the deployment: '+rel)
              require(sum(map(len,files.values()))<=20*1024*1024,'Admin assets exceed the 20 MiB review limit.')
              require(re.fullmatch(r'[0-9a-f]{40,64}',commit),'Invalid Git commit identifier.')
              require('</head>' in page,'Admin page closing head tag is missing.')
              page=page.replace('</head>','<meta name="artemis-admin-commit" content="'+commit+'"></head>',1)
              files['index.html']=page.encode()
              files['deployment.json']=json.dumps({'commit':commit,'deployedAtUtc':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),'sourceFolder':'admin'}).encode()
              output=io.BytesIO()
              with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED) as z:
                  for name,data in sorted(files.items()):z.writestr(name,data)
              return output.getvalue(),len(files)

          def main():
              require(os.environ.get('GITHUB_REPOSITORY','').lower()==REPOSITORY,'Wrong GitHub repository.')
              require(os.environ.get('GITHUB_REF')=='refs/heads/main','Only the main branch can deploy this app.')
              commit=os.environ['GITHUB_SHA']
              paths=subprocess.run(['git','ls-files','-z','--','admin'],capture_output=True,check=True).stdout.decode().split('\0')
              archive,count=bundle(Path('admin'),[x for x in paths if x],commit)
              app=aws('get-app',app_id=APP)['app'];require(app.get('name')=='artemissignals-admin' and not app.get('repository'),'Target app changed; review before deploying.')
              latest=aws('list-jobs',app_id=APP,branch_name=BRANCH,max_results=5).get('jobSummaries',[])
              require(not any(j.get('status') in ('PENDING','PROVISIONING','RUNNING','CANCELLING') for j in latest),'Another Amplify deployment is active. Wait before running this workflow again.')
              print('Validated '+str(count)+' admin assets. Deploying commit '+commit+' to the EXISTING admin app.',flush=True)
              created=aws('create-deployment',app_id=APP,branch_name=BRANCH)
              url=created.get('zipUploadUrl','');require(url.startswith('https://'),'Amplify did not return an HTTPS upload URL.')
              try:
                  request=urllib.request.Request(url,data=archive,method='PUT',headers={'Content-Type':'application/zip'})
                  with urllib.request.urlopen(request,timeout=90) as uploaded:require(200<=uploaded.status<300,'Upload failed.')
              except Exception:raise RuntimeError('Upload failed. The signed upload URL has not been logged; the existing site was not replaced.') from None
              job_id=created['jobId'];aws('start-deployment',app_id=APP,branch_name=BRANCH,job_id=job_id)
              deadline=time.monotonic()+600;previous=None
              while True:
                  state=aws('get-job',app_id=APP,branch_name=BRANCH,job_id=job_id)['job']['summary']['status']
                  if state!=previous:print('Amplify job '+str(job_id)+': '+state,flush=True);previous=state
                  if state=='SUCCEED':break
                  require(state not in ('FAILED','CANCELLED'),'Amplify deployment failed. Inspect the job in the existing Amplify app.')
                  require(time.monotonic()<deadline,'Deployment is still pending. Check Amplify before rerunning; no rollback is claimed.')
                  time.sleep(5)
              # Verify actual public files, not just the Amplify job status.
              verified=False;deadline=time.monotonic()+120
              while time.monotonic()<deadline:
                  try:
                      with urllib.request.urlopen(urllib.request.Request('https://admin.artemissignals.ai/deployment.json?commit='+commit,headers={'Cache-Control':'no-cache'}),timeout=15) as r:stamp=json.load(r)
                      with urllib.request.urlopen(urllib.request.Request('https://admin.artemissignals.ai/?commit='+commit,headers={'Cache-Control':'no-cache'}),timeout=15) as r:page=r.read(2*1024*1024).decode()
                      if stamp.get('commit')==commit and 'name="artemis-admin-commit" content="'+commit+'"' in page:verified=True;break
                  except Exception:pass
                  time.sleep(5)
              require(verified,'Amplify deployment succeeded, but the custom domain has not verified the new commit yet. Check domain mapping and CDN propagation; no rollback is claimed.')
              print('VERIFIED: admin.artemissignals.ai serves Git commit '+commit)
              summary=os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:Path(summary).write_text('## Admin deployment verified\n\n- Existing app: `'+APP+'`\n- Branch: `main`\n- Source: `admin/`\n- Commit: `'+commit+'`\n- URL: https://admin.artemissignals.ai/\n')

          try:
              if __name__=='__main__':main()
          except Exception as e:
              print('Deployment stopped: '+(str(e) if isinstance(e,RuntimeError) else type(e).__name__+'; sensitive details withheld.'),file=sys.stderr);sys.exit(1)

          PY
