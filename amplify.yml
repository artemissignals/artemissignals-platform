version: 1
applications:
  - appRoot: launch
    frontend:
      phases:
        build:
          commands:
            - echo "Deploying ArtemisSignals launch site"
      artifacts:
        baseDirectory: .
        files:
          - '**/*'
      cache:
        paths: []
  - appRoot: dashboard
    frontend:
      phases:
        build:
          commands:
            - echo "Deploying ArtemisSignals customer app"
      artifacts:
        baseDirectory: .
        files:
          - '**/*'
      cache:
        paths: []
