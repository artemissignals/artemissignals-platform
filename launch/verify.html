<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Verify early access — ArtemisSignals</title><style>body{background:#08111e;color:#eff6fc;font:17px/1.6 system-ui;text-align:center;margin:0;padding:50px 20px}.box{background:#13243a;border:1px solid #36536c;border-radius:18px;max-width:640px;padding:32px;margin:auto}h1{color:#f4a267}a{color:#f4a267}input{font:inherit;width:100%;padding:12px;background:#0b1625;color:white;border:1px solid #52708a;border-radius:8px;box-sizing:border-box}button{padding:12px 18px;background:#f4a267;color:#132034;border:0;border-radius:9px;cursor:pointer;margin-top:12px}</style></head><body><div class="box"><h1>ArtemisSignals</h1><h2>Email confirmation</h2><p id="status" role="status">Checking your verification link…</p><div id="ref" hidden><p>Invite others using your personal link:</p><input id="link" readonly aria-label="Your referral link"><button id="copy" type="button">Copy referral link</button></div><p><a href="/">Return to ArtemisSignals</a></p></div><script src="/config.js"></script><script>(async function(){const status=document.getElementById('status');const token=new URLSearchParams(location.search).get('token');const endpoint=window.ARTEMIS_WAITLIST_ENDPOINT;if(!token||!endpoint){status.textContent='This link is incomplete. Please register again.';return;}try{const url=endpoint.replace(/\/interest$/, '/verify')+'?token='+encodeURIComponent(token);const r=await fetch(url,{method:'GET'});const p=await r.json();if(!r.ok)throw new Error(p.message||'Verification failed');status.textContent=p.message||'Verified!';if(p.referralUrl){document.getElementById('ref').hidden=false;document.getElementById('link').value=p.referralUrl;document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(p.referralUrl).then(()=>document.getElementById('copy').textContent='Copied!');}history.replaceState({},'',location.pathname);}catch(e){status.textContent=e.message||'Unable to verify right now.';}})();</script></body></html>
